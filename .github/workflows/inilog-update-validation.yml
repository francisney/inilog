name: INILOG - validacao irm e iex
on:
  push:
    branches:
      - codex/fix-iex-mwxxie99
permissions:
  contents: read
concurrency:
  group: codex/fix-iex-mwxxie99
  cancel-in-progress: true
jobs:
  powershell51:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Obter arquivos deste commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $base = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/' + $env:GITHUB_SHA
          $folder = Join-Path $env:GITHUB_WORKSPACE '.inilog-validation'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri ($base + '/update.ps1') -OutFile (Join-Path $folder 'update.candidate.ps1')
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri ($base + '/.ci/validate-update.ps1') -OutFile (Join-Path $folder 'validate-update.ps1')
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri 'https://raw.githubusercontent.com/francisney/inilog/17cddc35abcc72a062f8e652feecb78a8a83c0a9/update.ps1' -OutFile (Join-Path $folder 'update.original.ps1')
      - name: Testar arquivo e pipeline irm iex no Windows PowerShell 5.1
        shell: powershell
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE '.inilog-validation'
          $raw = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/' + $env:GITHUB_SHA + '/update.ps1'
          & (Join-Path $folder 'validate-update.ps1') -Candidate (Join-Path $folder 'update.candidate.ps1') -Original (Join-Path $folder 'update.original.ps1') -CandidateRawUri $raw -PreviousRawUri 'https://raw.githubusercontent.com/francisney/inilog/752f5545e25aef4cd71cb13acce941f9d471737e/update.ps1'
