name: Validar INILOG Upload publicado
on:
  push:
    branches:
      - codex/upload-v1-mwy3zxrv
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Obter executavel publicado e teste
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri 'https://inilog.com/backup/upload.exe' -OutFile dist/upload.exe
          if ((Get-FileHash dist/upload.exe -Algorithm SHA256).Hash -ne 'A8A4BBA293FCA106CB79BC1AE4521509F274B4AEEE503A2907D6C46EEB7B1211') { throw 'Executavel diverge da compilacao validada' }
          $url = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/' + $env:GITHUB_SHA + '/upload-tool/tests/LiveSmoke.cs'
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 -Uri $url -OutFile dist/LiveSmoke.cs
      - name: Testar envio real com o cliente compilado
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist\LiveSmoke.cs'
          $assembly = Join-Path $env:GITHUB_WORKSPACE 'dist\upload.exe'
          $testExe = Join-Path $env:GITHUB_WORKSPACE 'dist\LiveSmoke.exe'
          $result = Join-Path $env:GITHUB_WORKSPACE 'dist\live-validation.json'
          & $csc /nologo /codepage:65001 /target:exe "/out:$testExe" "/r:$assembly" /r:System.dll /r:System.Core.dll /r:System.Web.Extensions.dll $source
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar teste' }
          & $testExe $result
          if ($LASTEXITCODE -ne 0) { throw 'Falha no envio real' }
      - name: Guardar resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: INILOG-Upload-Live
          path: dist/live-validation.json
          if-no-files-found: error
          retention-days: 7
